<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Analyzer - Resumos Inteligentes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🎬 YouTube Analyzer</h1>
            <p class="tagline">Resumos inteligentes de qualquer vídeo do YouTube</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="card">
                <h2>Analisar Vídeo</h2>
                <p class="description">Cole o link do vídeo do YouTube e receba um resumo completo do conteúdo</p>
                
                <form id="analyzeForm" class="analyze-form">
                    <div class="input-group">
                        <input 
                            type="url" 
                            id="videoUrl" 
                            placeholder="https://www.youtube.com/watch?v=..." 
                            required
                            autocomplete="off"
                        >
                        <button type="submit" id="analyzeBtn" class="analyze-btn">
                            <span class="btn-text">🔍 Analisar Vídeo</span>
                            <span class="btn-loading">
                                <div class="spinner"></div>
                                Analisando...
                            </span>
                        </button>
                    </div>
                </form>

                <!-- Resultado -->
                <div id="result" class="result">
                    <div class="video-info">
                        <div class="thumbnail-container">
                            <img id="videoThumbnail" src="" alt="Thumbnail" class="thumbnail">
                        </div>
                        <div class="video-details">
                            <h3 id="videoTitle"></h3>
                            <p id="videoChannel"></p>
                            <div class="video-stats">
                                <span id="videoDuration"></span>
                                <span id="videoViews"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="summary-section">
                        <h4>📋 Resumo do Conteúdo</h4>
                        <div id="videoSummary" class="summary-content"></div>
                    </div>
                </div>

                <!-- Mensagem de Erro -->
                <div id="error" class="error-message">
                    <p id="errorText"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 YouTube Analyzer. Desenvolvido com ❤️ para a comunidade.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
